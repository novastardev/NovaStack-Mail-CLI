name: NovaStack Mail CLI tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Smoke-test built wheel and console command
        run: |
          python -m venv /tmp/novastackmail-smoke
          /tmp/novastackmail-smoke/bin/python -m pip install dist/*.whl
          /tmp/novastackmail-smoke/bin/novastackmail --version
          /tmp/novastackmail-smoke/bin/novastackmail --help
